name: NovaRise Telegram daily
on:
  schedule:
    - cron: '0 18 * * *'
      timezone: Europe/Madrid
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: novarise-telegram-daily
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish today's approved post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@NovaRiseNVRA"
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse, datetime, zoneinfo, sys
          if not os.environ.get("TELEGRAM_BOT_TOKEN"):
              sys.exit("Missing TELEGRAM_BOT_TOKEN secret")
          if os.environ.get("EVENT_NAME") == "workflow_dispatch":
              token = os.environ["TELEGRAM_BOT_TOKEN"]
              base = "https://api.telegram.org/bot" + token + "/"
              def call(method, args=None):
                  url = base + method
                  if args:
                      url += "?" + urllib.parse.urlencode(args)
                  with urllib.request.urlopen(url, timeout=25) as response:
                      result = json.load(response)
                  if not result.get("ok"):
                      sys.exit("Telegram API validation failed")
                  return result["result"]
              bot = call("getMe")
              channel = call("getChat", {"chat_id": os.environ["TELEGRAM_CHANNEL"]})
              membership = call("getChatMember", {"chat_id": os.environ["TELEGRAM_CHANNEL"], "user_id": bot["id"]})
              if channel.get("type") != "channel":
                  sys.exit("Configured destination is not a channel")
              if membership.get("status") not in ("administrator", "creator") or not membership.get("can_post_messages", False):
                  sys.exit("Bot lacks channel permission to post messages")
              print("Validation successful: bot can post to the channel. No message was sent.")
              sys.exit(0)
          today = datetime.datetime.now(zoneinfo.ZoneInfo("Europe/Madrid")).date().isoformat()
          with open("telegram/posts.json", encoding="utf-8") as f:
              posts = json.load(f)["posts"]
          match = next((p for p in posts if p["date"] == today), None)
          if not match:
              print(f"No approved Telegram post for {today}; skipping (no invented updates).")
              sys.exit(0)
          endpoint = "https://api.telegram.org/bot" + os.environ["TELEGRAM_BOT_TOKEN"] + "/sendPhoto"
          payload = urllib.parse.urlencode({
              "chat_id": os.environ["TELEGRAM_CHANNEL"],
              "photo": match["image"],
              "caption": match["text"][:1024],
          }).encode("utf-8")
          try:
              with urllib.request.urlopen(urllib.request.Request(endpoint, data=payload), timeout=45) as response:
                  data = json.load(response)
          except Exception as exc:
              print("Telegram publishing request failed:", type(exc).__name__)
              raise
          if not data.get("ok"):
              sys.exit("Telegram rejected publication")
          print(f"Telegram publication successful for {today}.")
          PY
