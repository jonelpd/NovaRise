name: Road navigation safety tests
on:
  push:
    paths:
      - 'scripts/map-road-*.cjs'
      - 'scripts/validate-map-road-release.cjs'
      - 'scripts/audit-map-road-topology.cjs'
      - 'tests/p0-map-road-*.test.cjs'
      - 'tools/editor-caminos.html'
      - 'tools/revisar-rutas-marcadas.html'
      - 'docs/mapa-original-rutas-trazado-preliminar.json'
      - 'docs/mapa-rutas-marcadas-tramo-central.json'
      - 'docs/mapa-compartido-ediciones.json'
      - '.github/workflows/road-navigation-tests.yml'
  pull_request:
    paths:
      - 'scripts/map-road-*.cjs'
      - 'scripts/validate-map-road-release.cjs'
      - 'scripts/audit-map-road-topology.cjs'
      - 'tests/p0-map-road-*.test.cjs'
      - 'tools/editor-caminos.html'
      - 'docs/mapa-original-rutas-trazado-preliminar.json'
      - '.github/workflows/road-navigation-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  road-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate road editor and navigation modules
        run: node --test tests/p0-map-road-editor-safety.test.cjs tests/p0-map-road-topology.test.cjs tests/p0-map-road-walker.test.cjs tests/p0-map-road-marked-corridor.test.cjs tests/p0-map-road-review-overlay.test.cjs tests/p0-map-editions-parity.test.cjs
