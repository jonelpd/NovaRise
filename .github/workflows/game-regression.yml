name: Game regression tests
on:
  push:
    branches: [main]
    paths:
      - 'juego/**'
      - 'tests/**'
      - '.github/workflows/game-regression.yml'
  pull_request:
    paths:
      - 'juego/**'
      - 'tests/**'
      - '.github/workflows/game-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  game-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run gameplay and save regression tests
        run: node --test tests/p0-*.test.cjs
