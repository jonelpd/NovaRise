name: Game regression tests
on:
  push:
    branches: [main]
    paths:
      - 'juego/**'
      - 'tests/**'
      - '.github/workflows/game-regression.yml'
  pull_request:
    paths:
      - 'juego/**'
      - 'tests/**'
      - '.github/workflows/game-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  game-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run gameplay and save regression tests
        shell: bash
        run: |
          set -o pipefail
          node --test --test-reporter=tap tests/p0-*.test.cjs | tee game-regression-results.tap
      - name: Publish test report
        if: always()
        run: |
          if [ -f game-regression-results.tap ]; then
            echo '## Reinos de Leyenda — pruebas automáticas' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 35 game-regression-results.tap >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Attach test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reinos-de-leyenda-regression-results
          path: game-regression-results.tap
          if-no-files-found: warn
