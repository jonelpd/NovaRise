name: NVRA experimental contract tests
on:
  push:
    paths:
      - 'contracts/**'
      - '.github/workflows/nvra-contract.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'contracts/**'
      - '.github/workflows/nvra-contract.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Structural preflight
        run: npm run preflight
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Compile Solidity
        run: npm run compile
      - name: Run contract tests
        run: npm test
      - name: Upload diagnostic report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nvra-contract-diagnostics
          path: |
            contracts/artifacts/
            contracts/cache/
          if-no-files-found: ignore
          retention-days: 7
