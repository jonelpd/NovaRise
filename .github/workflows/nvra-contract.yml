name: NVRA experimental contract tests
on:
  push:
    paths:
      - 'contracts/**'
      - '.github/workflows/nvra-contract.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'contracts/**'
      - '.github/workflows/nvra-contract.yml'

permissions:
  contents: read

jobs:
  preflight:
    name: Structural preflight (no npm dependencies)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate repository contract structure
        run: npm run preflight

  contract:
    name: Solidity compile and Hardhat tests
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund --fetch-retries=3
      - name: Fetch integrity-pinned Safe Solidity sources
        run: |
          mkdir -p safe-source node_modules/@safe-global/safe-contracts
          npm pack @safe-global/safe-contracts@1.4.1-2 --ignore-scripts --pack-destination safe-source --silent
          node -e 'const fs=require("fs"),crypto=require("crypto"),path=require("path");const e=require("./safe-deps/package-lock.json").packages["node_modules/@safe-global/safe-contracts"];const f=path.join("safe-source","safe-global-safe-contracts-1.4.1-2.tgz");const b=fs.readFileSync(f);if(e.version!=="1.4.1-2"||"sha512-"+crypto.createHash("sha512").update(b).digest("base64")!==e.integrity)throw Error("Safe source integrity mismatch");'
          tar -xzf safe-source/safe-global-safe-contracts-1.4.1-2.tgz -C safe-source --no-same-owner --no-same-permissions
          cp -R safe-source/package/contracts node_modules/@safe-global/safe-contracts/contracts
          node -e 'const p=require("./safe-source/package/package.json");if(p.name!=="@safe-global/safe-contracts"||p.version!=="1.4.1-2")throw Error("Safe package metadata mismatch");require("fs").writeFileSync("node_modules/@safe-global/safe-contracts/package.json",JSON.stringify({name:p.name,version:p.version,license:p.license}));'
      - name: Run Safe preflight negative tests
        run: npm run test:safe-preflight
      - name: Compile Solidity
        run: npm run compile
      - name: Run contract tests
        run: npm test
      - name: Rehearse local-only deployment and token transfer
        run: npm run simulate:local
      - name: Upload diagnostic report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nvra-contract-diagnostics
          path: |
            contracts/artifacts/
            contracts/cache/
          if-no-files-found: ignore
          retention-days: 7
