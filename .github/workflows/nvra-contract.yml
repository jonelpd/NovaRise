name: NVRA experimental contract tests
on:
  push:
    paths:
      - 'contracts/**'
      - '.github/workflows/nvra-contract.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'contracts/**'
      - '.github/workflows/nvra-contract.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run compile
      - run: npm test
