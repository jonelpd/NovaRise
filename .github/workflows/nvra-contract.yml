name: NVRA experimental contract tests
on:
  push:
    paths:
      - 'contracts/**'
      - '.github/workflows/nvra-contract.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'contracts/**'
      - '.github/workflows/nvra-contract.yml'

permissions:
  contents: read

jobs:
  preflight:
    name: Structural preflight (no npm dependencies)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Validate repository contract structure
        run: npm run preflight
      - name: Check Amoy preparation manifest (read-only)
        run: npm run amoy:readiness

  contract:
    name: Solidity compile and Hardhat tests
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund --fetch-retries=3
      - name: Compile Solidity
        run: npm run compile
      - name: Run contract tests
        run: npm test
      - name: Rehearse local-only deployment and token transfer
        run: npm run simulate:local
      - name: Upload diagnostic report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nvra-contract-diagnostics
          path: |
            contracts/artifacts/
            contracts/cache/
          if-no-files-found: ignore
          retention-days: 7
