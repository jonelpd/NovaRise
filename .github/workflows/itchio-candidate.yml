name: Build itch.io HTML5 candidate (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-html5:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression tests
        run: node --test tests/p0-*.test.cjs
      - name: Assemble browser edition candidate
        shell: bash
        run: |
          set -euo pipefail
          test -s juego/index.html
          mkdir -p dist/itchio
          cp -a juego/. dist/itchio/
          test -s dist/itchio/index.html
          # Detect missing relative asset paths referenced directly in the HTML.
          node scripts/check-itchio-assets.cjs dist/itchio
          node scripts/audit-itchio-external.cjs dist/itchio dist/itchio-external-audit.json
          cd dist/itchio
          zip -q -r ../reinos-de-leyenda-itchio-candidate.zip .
      - name: Upload candidate (not published)
        uses: actions/upload-artifact@v4
        with:
          name: reinos-de-leyenda-itchio-candidate
          path: |
            dist/reinos-de-leyenda-itchio-candidate.zip
            dist/itchio-external-audit.json
          if-no-files-found: error
