name: NovaRise one-time announcement 2026-11-07
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/telegram-nvra-announcement-20261107.yml'
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish official NVRA update with image
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, urllib.parse, urllib.request, json, sys
          token = os.environ.get("TELEGRAM_BOT_TOKEN")
          if not token:
              sys.exit("Missing TELEGRAM_BOT_TOKEN")
          caption = """🚀 NOVARISE | AVANCES OFICIALES

🟢 NVRA ya está emitido en Base Mainnet: 1.000.000 tokens de suministro fijo.
✅ Código del contrato verificado en BaseScan.
🎨 Solicitud del logotipo oficial recibida por BaseScan (ticket #877695); pendiente de revisión.

🎮 Reinos de Leyenda continúa en desarrollo.
📚 Juegos educativos y herramientas accesibles: objetivos futuros, aún no lanzados.

🔎 https://basescan.org/token/0xa1128B1F4CB8394c179eb2558608a7302972EcBF
🌐 https://jonelpd.github.io/NovaRise/
Sin venta pública ni rentabilidad garantizada.
#NovaRise #NVRA #Base"""
          data = urllib.parse.urlencode({
            "chat_id": "@NovaRiseNVRA",
            "photo": "https://jonelpd.github.io/NovaRise/assets/a_high_contrast_glowing_futuristic_logo_banner.png",
            "caption": caption
          }).encode()
          req=urllib.request.Request("https://api.telegram.org/bot"+token+"/sendPhoto",data=data)
          with urllib.request.urlopen(req,timeout=40) as response:
              result=json.load(response)
          if not result.get("ok"):
              sys.exit("Telegram rejected publication")
          print("Published Telegram message ID:",result["result"]["message_id"])
          PY
