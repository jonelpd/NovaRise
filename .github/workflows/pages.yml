name: Publicar NovaRise en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar sitio público con lista permitida
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -- *.html *.atom robots.txt sitemap.xml _site/
          cp -R assets juego _site/
          # El módulo de billetera sigue suspendido y no debe publicarse.
          rm -f _site/juego/nvra-wallet-readonly.js
          test -f _site/index.html
          test -f _site/juego/index.html
          test ! -e _site/contracts
          test ! -e _site/docs
          test ! -e _site/.github
          test ! -e _site/tests
          test ! -e _site/juego/nvra-wallet-readonly.js
      - name: Preparar archivos estáticos
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verificar rutas públicas y bloqueo de billetera en Pages
        shell: bash
        run: |
          set -euo pipefail
          base="https://jonelpd.github.io/NovaRise"
          for attempt in 1 2 3 4 5 6; do
            root_code=$(curl -L -sS --max-time 15 -o /tmp/nvra-root.html -w '%{http_code}' "$base/index.html" || true)
            game_code=$(curl -L -sS --max-time 15 -o /tmp/nvra-game.html -w '%{http_code}' "$base/juego/index.html" || true)
            wallet_code=$(curl -L -sS --max-time 15 -o /dev/null -w '%{http_code}' "$base/juego/nvra-wallet-readonly.js" || true)
            docs_code=$(curl -L -sS --max-time 15 -o /dev/null -w '%{http_code}' "$base/docs/plan-maestro-reinos-de-leyenda.md" || true)
            printf 'Intento %s: portada=%s juego=%s billetera=%s docs=%s\n' "$attempt" "$root_code" "$game_code" "$wallet_code" "$docs_code"
            if [[ "$root_code" == 200 && "$game_code" == 200 && "$wallet_code" == 404 && "$docs_code" == 404 ]] &&
               grep -q 'Conexión de monedero: suspendida temporalmente' /tmp/nvra-game.html; then
              echo "Despliegue público y suspensión NVRA verificados"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Las rutas públicas o el bloqueo NVRA no coinciden con el despliegue esperado"
          exit 1
