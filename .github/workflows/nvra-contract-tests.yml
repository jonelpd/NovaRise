name: NVRA Solidity contracts local tests
on:
  push:
    paths:
      - 'contracts/**'
      - '.github/workflows/nvra-contract-tests.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - '.github/workflows/nvra-contract-tests.yml'
  workflow_dispatch:
jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install root dependencies from committed lockfile
        run: npm ci --no-audit --no-fund
      - name: Install isolated official Safe contracts from committed lockfile
        run: npm ci --prefix safe-deps --no-audit --no-fund
      - name: Dependency vulnerability inventory (non-blocking evidence)
        run: |
          npm audit --json > npm-audit-root.json || true
          npm audit --prefix safe-deps --json > npm-audit-safe.json || true
          node -e 'for(const f of ["npm-audit-root.json","npm-audit-safe.json"]){const x=require("./"+f);console.log(f,JSON.stringify(x.metadata?.vulnerabilities||{}));for(const [name,v] of Object.entries(x.vulnerabilities||{})){console.log(JSON.stringify({tree:f,package:name,severity:v.severity,isDirect:v.isDirect,range:v.range,via:v.via.map(z=>typeof z==="string"?z:{name:z.name,title:z.title,url:z.url,range:z.range}),effects:v.effects,fixAvailable:v.fixAvailable}));}}'
      - name: Upload dependency vulnerability reports
        uses: actions/upload-artifact@v4
        with:
          name: nvra-dependency-audit
          path: |
            contracts/npm-audit-root.json
            contracts/npm-audit-safe.json
          retention-days: 30
      - name: Record dependency versions and lockfile checksums
        run: |
          node -p '"Node " + process.version + ", npm " + process.env.npm_config_user_agent'
          npm ls --depth=0
          npm ls --prefix safe-deps --depth=0
          sha256sum package-lock.json safe-deps/package-lock.json
      - name: Upload lockfiles for review and repository pinning
        uses: actions/upload-artifact@v4
        with:
          name: nvra-npm-lockfiles
          path: |
            contracts/package-lock.json
            contracts/safe-deps/package-lock.json
          retention-days: 30
      - name: Expose isolated Safe Solidity package to Hardhat resolver
        run: |
          mkdir -p node_modules/@safe-global
          cp -R safe-deps/node_modules/@safe-global/safe-contracts node_modules/@safe-global/safe-contracts
      - name: Compile Solidity contracts
        run: npx hardhat compile
      - name: Run all local Hardhat tests
        run: npx hardhat test --network hardhat
