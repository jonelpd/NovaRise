name: NVRA Solidity contracts local tests
on:
  push:
    paths:
      - 'contracts/**'
      - '.github/workflows/nvra-contract-tests.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - '.github/workflows/nvra-contract-tests.yml'
  workflow_dispatch:
jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install root dependencies from committed lockfile
        run: npm ci --no-audit --no-fund
      - name: Fetch integrity-pinned Safe Solidity sources without JS dependencies
        run: |
          mkdir -p safe-source node_modules/@safe-global/safe-contracts
          npm pack @safe-global/safe-contracts@1.4.1-2 --ignore-scripts --pack-destination safe-source --silent
          node -e 'const fs=require("fs"),crypto=require("crypto"),path=require("path");const e=require("./safe-deps/package-lock.json").packages["node_modules/@safe-global/safe-contracts"];const f=path.join("safe-source","safe-global-safe-contracts-1.4.1-2.tgz");const b=fs.readFileSync(f);if(e.version!=="1.4.1-2"||"sha512-"+crypto.createHash("sha512").update(b).digest("base64")!==e.integrity)throw Error("Safe source integrity mismatch");fs.writeFileSync("safe-solidity-provenance.json",JSON.stringify({package:"@safe-global/safe-contracts",version:e.version,integrity:e.integrity,sha256:crypto.createHash("sha256").update(b).digest("hex"),source:e.resolved,scope:"Solidity sources only"},null,2));'
          tar -xzf safe-source/safe-global-safe-contracts-1.4.1-2.tgz -C safe-source --no-same-owner --no-same-permissions
          cp -R safe-source/package/contracts node_modules/@safe-global/safe-contracts/contracts
          node -e 'const p=require("./safe-source/package/package.json");if(p.name!=="@safe-global/safe-contracts"||p.version!=="1.4.1-2")throw Error("Safe package metadata mismatch");require("fs").writeFileSync("node_modules/@safe-global/safe-contracts/package.json",JSON.stringify({name:p.name,version:p.version,license:p.license}));'
      - name: Dependency vulnerability inventory (non-blocking evidence)
        run: |
          npm audit --json > npm-audit-root.json || true
          # Safe Solidity sources are extracted without installing their npm peer dependencies.
          node -e 'for(const f of ["npm-audit-root.json"]){const x=require("./"+f);console.log(f,JSON.stringify(x.metadata?.vulnerabilities||{}));for(const [name,v] of Object.entries(x.vulnerabilities||{})){console.log(JSON.stringify({tree:f,package:name,severity:v.severity,isDirect:v.isDirect,range:v.range,via:v.via.map(z=>typeof z==="string"?z:{name:z.name,title:z.title,url:z.url,range:z.range}),effects:v.effects,fixAvailable:v.fixAvailable}));}}'
      - name: Upload dependency vulnerability reports
        uses: actions/upload-artifact@v4
        with:
          name: nvra-dependency-audit
          path: |
            contracts/npm-audit-root.json
            contracts/safe-solidity-provenance.json
          retention-days: 30
      - name: Record dependency versions and lockfile checksums
        run: |
          node -p '"Node " + process.version + ", npm " + process.env.npm_config_user_agent'
          npm ls --depth=0
          node -e 'const p=require("./safe-solidity-provenance.json"); console.log("Safe Solidity-only package",p.package,p.version,p.integrity)'
          sha256sum package-lock.json safe-deps/package-lock.json
      - name: Upload lockfiles for review and repository pinning
        uses: actions/upload-artifact@v4
        with:
          name: nvra-npm-lockfiles
          path: |
            contracts/package-lock.json
            contracts/safe-deps/package-lock.json
          retention-days: 30
      - name: Verify no Safe JavaScript peer dependencies installed
        run: |
          test -f node_modules/@safe-global/safe-contracts/contracts/Safe.sol
          test ! -d safe-deps/node_modules
      - name: Compile Solidity contracts
        run: npx hardhat compile
      - name: Run all local Hardhat tests
        run: npx hardhat test --network hardhat
