name: NovaRise - pruebas estáticas
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar páginas, enlaces, idiomas y seguridad de contenido
        run: |
          node tests/site-integrity.test.cjs
          node --check assets/base-portal.js
          node tests/base-portal.test.cjs
          node --check assets/analyzer.js
          node --check assets/locale-en.js
          node --check assets/interest.js
          node --check assets/roadmap-public.js
          node --check assets/crm.js
      - name: Verificar diseño responsive y ausencia de testnet en páginas públicas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pages=['index.html','en.html','libro-blanco.html','whitepaper-en.html','tokenomics.html','tokenomics-en.html']
          for name in pages:
              content=Path(name).read_text(encoding='utf-8')
              assert 'name="viewport"' in content, name
              assert 'assets/site.css' in content, name
              assert not any(term in content.lower() for term in ['amoy','access-pass']), name
              assert 'Base' in content, name
          css=Path('assets/site.css').read_text(encoding='utf-8')
          assert '.simple-hero' in css and '@media(max-width:760px)' in css
          print('Base-only content, mobile viewport and responsive CSS: OK')
          PY
