name: Audit turquoise map
on:
  push:
    paths:
      - 'scripts/audit-turquoise-map.cjs'
      - 'scripts/test-turquoise-navigation.cjs'
      - 'scripts/test-turquoise-site-access.cjs'
      - 'scripts/test-turquoise-mask-schema.cjs'
      - 'scripts/test-coastal-castle-staircase.cjs'
      - 'scripts/audit-seven-castle-access.cjs'
      - 'docs/ramal-castillo-costero-propuesta-2026-11-16.json'
      - 'juego/index.html'
      - 'juego/rutas-turquesa-160.json'
      - 'docs/catalogo-elementos-mapa-nuevo.json'
      - '.github/workflows/audit-turquoise-map.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test turquoise-only movement and failed loading
        run: |
          node scripts/test-turquoise-navigation.cjs
          node scripts/test-turquoise-site-access.cjs
          node scripts/test-turquoise-mask-schema.cjs
          node scripts/test-coastal-castle-staircase.cjs
          node scripts/audit-seven-castle-access.cjs
      - name: Audit topology and 44 access candidates
        run: |
          node scripts/audit-turquoise-map.cjs --json > turquoise-audit-report.json
          node -e "const r=require('./turquoise-audit-report.json'); if(r.sites.length!==44) process.exit(1); if(r.actual_components!==r.declared_components) console.warn('WARNING: component count differs; see diagnostic artifact.'); console.log('Road cells:',r.road_cells,'Components:',r.actual_components,'Sites:',r.sites.length); console.table(r.components); console.table(r.gaps.map(g=>({pair:g.components.join('-'),gap:g.minimum_gap_cells.toFixed(2)})))"
      - name: Publish readable audit summary
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync('turquoise-audit-report.json','utf8'));
          const flagged=r.sites.filter(s=>s.risks&&s.risks.length);
          const short=flagged.filter(s=>s.risks.includes('SHORT_COMPONENT'));
          const far=flagged.filter(s=>s.risks.includes('FAR_FROM_ROAD'));
          const lines=[
            '# Auditoría de caminos turquesas',
            '',
            '| Métrica | Resultado |',
            '|---|---:|',
            '| Celdas de ruta | '+r.road_cells+' |',
            '| Componentes reales (regla antiesquinas) | '+r.actual_components+' |',
            '| Componentes declaradas | '+r.declared_components+' |',
            '| Elementos examinados | '+r.sites.length+' |',
            '| Accesos próximos a componentes cortas (<50 celdas) | '+short.length+' |',
            '| Elementos a más de 5 celdas de la ruta | '+far.length+' |',
            '| Elementos sin acceso dentro de 14 celdas | '+r.sites.filter(s=>s.risks.includes('NO_ENTRANCE_WITHIN_14')).length+' |',
            '| Elementos con acceso a varias redes desconectadas | '+r.sites.filter(s=>s.risks.includes('AMBIGUOUS_COMPONENT_ACCESS')).length+' |',
            '| Elementos sin componente compartida con el castillo inicial | '+r.sites.filter(s=>s.risks.includes('NO_SHARED_COMPONENT_WITH_HOME')).length+' |',
            '| Elementos cuyo punto más próximo es un píxel aislado | '+r.sites.filter(s=>s.risks.includes('NEAREST_IS_ISOLATED_PIXEL')).length+' |',
            '',
            '**ATENCIÓN:** una ejecución verde valida el analizador, no las entradas ni la jugabilidad.',
            '',
            '## Entradas que requieren revisión',
            '| Elemento | Riesgo | Distancia (celdas) | Tamaño de red |',
            '|---|---|---:|---:|',
            ...flagged.map(s=>'| '+s.id+' | '+s.risks.join(', ')+' | '+(s.nearest?.distance_cells??0).toFixed(2)+' | '+s.nearest_component_size+' |'),
            '',
            '## Cortes más próximos',
            '| Componentes | Separación (celdas) |',
            '|---|---:|',
            ...r.gaps.slice().sort((a,b)=>a.minimum_gap_cells-b.minimum_gap_cells).slice(0,12).map(g=>'| '+g.components.join('–')+' | '+g.minimum_gap_cells.toFixed(2)+' |')
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          NODE
      - name: Publish seven-castle access status
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync('castle-access-audit.json','utf8'));
          const lines=[
            '## Accesos de los siete castillos (máscara activa)',
            '',
            '| Castillo | Estado geométrico | Redes cercanas | Comparte red con castillo inicial | Corte más próximo (celdas) |',
            '|---|---|---:|---|---:|',
            ...r.castles.map(c=>'| '+c.id+' | '+c.status+' | '+c.candidates.length+' | '+(c.shared_with_home.join(', ')||'No')+' | '+(c.nearest_separate_network_gap?.distance_cells.toFixed(2)||'—')+' |'),
            '',
            '**Aviso:** proximidad geométrica y conectividad de máscara no equivalen a puerta visual ni interacción probada en navegador.'
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          NODE
      - name: Upload map-pixel castle gap review
        uses: actions/upload-artifact@v4
        with:
          name: castle-gaps-visual-review
          path: castle-gaps-visual-review.json
          retention-days: 30
      - name: Upload seven-castle access report
        uses: actions/upload-artifact@v4
        with:
          name: castle-access-audit
          path: castle-access-audit.json
          retention-days: 30
      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: turquoise-map-audit
          path: turquoise-audit-report.json
