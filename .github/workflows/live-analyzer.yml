name: NovaRise - comprobación de proveedores reales
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/live-analyzer.yml'
jobs:
  external-apis:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Consultar GoPlus y DexScreener para USDC en Base
        shell: bash
        run: |
          node <<'JS'
          const address='0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913';
          const checks=[
            {name:'GoPlus',url:'https://api.gopluslabs.io/api/v1/token_security/8453?contract_addresses='+address.toLowerCase(),validate:d=>d&&typeof d==='object'&&('code' in d)&&('result' in d)},
            {name:'DexScreener',url:'https://api.dexscreener.com/token-pairs/v1/base/'+address,validate:d=>Array.isArray(d)&&d.some(p=>p?.chainId==='base'&&[p.baseToken?.address,p.quoteToken?.address].some(a=>a?.toLowerCase()===address.toLowerCase()))}
          ];
          (async()=>{
            let failures=0;
            for(const check of checks){
              try{
                const response=await fetch(check.url,{signal:AbortSignal.timeout(15000),headers:{Accept:'application/json'}});
                if(!response.ok)throw Error('HTTP '+response.status);
                const data=await response.json();
                if(!check.validate(data))throw Error('Respuesta sin formato o datos esperados');
                console.log('PASS '+check.name+': respuesta real válida para USDC en Base');
              }catch(error){failures++;console.error('FAIL '+check.name+': '+error.message);}
            }
            if(failures)process.exitCode=1;
          })();
          JS
