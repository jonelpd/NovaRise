name: NVRA Hardhat 3 isolated migration experiment
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/nvra-hardhat3-experiment.yml'
      - 'contracts/src/**'
jobs:
  experimental-hardhat3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create isolated Hardhat 3 sandbox
        run: |
          mkdir -p /tmp/nvra-hardhat3/src
          cp -R contracts/src/. /tmp/nvra-hardhat3/src/
          cp contracts/NVRAToken.sol /tmp/nvra-hardhat3/NVRAToken.sol
          cd /tmp/nvra-hardhat3
          printf '%s\n' '{"name":"nvra-hardhat3-evaluation","private":true,"type":"module"}' > package.json
          npm install --no-audit --no-fund --save-dev hardhat@^3 @nomicfoundation/hardhat-ethers@^4
          npm install --no-audit --no-fund --save @openzeppelin/contracts@^5
      - name: Acquire identical integrity-verified Safe Solidity sources
        run: |
          cd /tmp/nvra-hardhat3
          mkdir -p safe-package node_modules/@safe-global/safe-contracts
          npm pack @safe-global/safe-contracts@1.4.1-2 --ignore-scripts --pack-destination safe-package --silent
          node -e 'const fs=require("fs"),crypto=require("crypto");const e=require(process.env.GITHUB_WORKSPACE+"/contracts/safe-deps/package-lock.json").packages["node_modules/@safe-global/safe-contracts"];const b=fs.readFileSync("safe-package/safe-global-safe-contracts-1.4.1-2.tgz");if(e.version!=="1.4.1-2"||"sha512-"+crypto.createHash("sha512").update(b).digest("base64")!==e.integrity)throw Error("Safe tarball integrity mismatch");'
          tar -xzf safe-package/safe-global-safe-contracts-1.4.1-2.tgz -C safe-package --no-same-owner --no-same-permissions
          cp -R safe-package/package/contracts node_modules/@safe-global/safe-contracts/contracts
          node -e 'const p=require("./safe-package/package/package.json");require("fs").writeFileSync("node_modules/@safe-global/safe-contracts/package.json",JSON.stringify({name:p.name,version:p.version}));'
      - name: Generate separate Hardhat 3 ESM config
        run: |
          cat > /tmp/nvra-hardhat3/hardhat.config.ts <<'EOF'
          import { defineConfig } from "hardhat/config";
          import hardhatEthers from "@nomicfoundation/hardhat-ethers";
          export default defineConfig({
            plugins: [hardhatEthers],
            solidity: {
              compilers: [
                { version: "0.8.24", settings: { optimizer: { enabled: true, runs: 200 } } },
                { version: "0.7.6", settings: { optimizer: { enabled: false } } }
              ]
            },
            paths: { sources: "./src", tests: "./test" }
          });
          EOF
      - name: Experimental compilation (independent of production CI)
        working-directory: /tmp/nvra-hardhat3
        run: |
          npx hardhat --version
          npx hardhat compile
      - name: Hardhat 3 isolated token and vesting smoke tests
        working-directory: /tmp/nvra-hardhat3
        run: |
          cat > smoke.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { network } from "hardhat";
          const { ethers } = await network.connect();
          const [deployer, beneficiary] = await ethers.getSigners();
          const Treasury = await ethers.getContractFactory("MockNVRATreasury");
          const treasury = await Treasury.deploy();
          await treasury.waitForDeployment();
          const Token = await ethers.getContractFactory("NVRAMainnetCandidate");
          const token = await Token.deploy(await treasury.getAddress());
          await token.waitForDeployment();
          const supply = ethers.parseUnits("1000000", 18);
          assert.equal(await token.totalSupply(), supply);
          assert.equal(await token.balanceOf(await treasury.getAddress()), supply);
          assert.equal(await token.balanceOf(deployer.address), 0n);
          const Vesting = await ethers.getContractFactory("NVRATeamVesting");
          const start = 2000000000, cliff = 86400, linear = 259200;
          const vest = await Vesting.deploy(beneficiary.address, start, cliff, linear);
          await vest.waitForDeployment();
          const amount = ethers.parseUnits("150000", 18);
          await (await treasury.sendToken(await token.getAddress(), await vest.getAddress(), amount)).wait();
          const addr = await token.getAddress();
          assert.equal(await vest["vestedAmount(address,uint64)"](addr, start + cliff), 0n);
          assert.equal(await vest["vestedAmount(address,uint64)"](addr, start + cliff + linear / 2), amount / 2n);
          assert.equal(await vest["vestedAmount(address,uint64)"](addr, start + cliff + linear), amount);
          assert.equal(await token.totalSupply(), supply);
          console.log("Hardhat 3 smoke tests passed: fixed supply, treasury, cliff, linear vesting");
          EOF
          node smoke.mjs
      - name: Hardhat 3 official Safe 3-of-5 adversarial smoke tests
        working-directory: /tmp/nvra-hardhat3
        run: |
          cat > safe-smoke.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { network } from "hardhat";
          const { ethers } = await network.connect();
          const accounts = await ethers.getSigners();
          const owners = accounts.slice(0, 5), outsider = accounts[5], recipient = accounts[6];
          const singleton = await (await ethers.getContractFactory("Safe")).deploy();
          await singleton.waitForDeployment();
          const factory = await (await ethers.getContractFactory("SafeProxyFactory")).deploy();
          await factory.waitForDeployment();
          const initializer = singleton.interface.encodeFunctionData("setup", [
            owners.map(s => s.address), 3, ethers.ZeroAddress, "0x",
            ethers.ZeroAddress, ethers.ZeroAddress, 0, ethers.ZeroAddress
          ]);
          const receipt = await (await factory.createProxyWithNonce(await singleton.getAddress(), initializer, 42)).wait();
          const event = receipt.logs.map(log => { try { return factory.interface.parseLog(log); } catch { return null; } }).find(x => x?.name === "ProxyCreation");
          assert.ok(event, "Safe proxy creation event missing");
          const safe = singleton.attach(event.args.proxy);
          assert.equal(await safe.getThreshold(), 3n);
          assert.deepEqual((await safe.getOwners()).map(x => x.toLowerCase()).sort(),
            owners.map(x => x.address.toLowerCase()).sort());
          const token = await (await ethers.getContractFactory("NVRAMainnetCandidate")).deploy(await safe.getAddress());
          await token.waitForDeployment();
          const supply = ethers.parseUnits("1000000", 18);
          assert.equal(await token.totalSupply(), supply);
          assert.equal(await token.balanceOf(await safe.getAddress()), supply);
          const amount = ethers.parseUnits("250", 18);
          const data = token.interface.encodeFunctionData("transfer", [recipient.address, amount]);
          const args = [await token.getAddress(), 0n, data, 0, 0n, 0n, 0n, ethers.ZeroAddress, ethers.ZeroAddress];
          const hash = await safe.getTransactionHash(...args, await safe.nonce());
          const signatures = signers => ethers.hexlify(ethers.concat(
            [...signers].sort((a,b) => a.address.toLowerCase().localeCompare(b.address.toLowerCase()))
              .map(s => ethers.concat([ethers.zeroPadValue(s.address, 32), ethers.ZeroHash, "0x01"]))
          ));
          const rejected = async (promise, label) => {
            let failed = false;
            try { await (await promise).wait(); } catch { failed = true; }
            assert.ok(failed, label);
          };
          await rejected(safe.connect(outsider).approveHash(hash), "Non-owner cannot approve");
          for (const signer of owners.slice(0, 3)) await (await safe.connect(signer).approveHash(hash)).wait();
          for (const n of [1, 2]) {
            await rejected(safe.connect(outsider).execTransaction(...args, signatures(owners.slice(0, n))),
              "Insufficient signatures: " + n);
          }
          assert.equal(await safe.nonce(), 0n);
          assert.equal(await token.balanceOf(recipient.address), 0n);
          const altered = [...args];
          altered[2] = token.interface.encodeFunctionData("transfer", [outsider.address, amount]);
          await rejected(safe.connect(outsider).execTransaction(...altered, signatures(owners.slice(0, 3))),
            "Altered transfer must fail");
          const result = await (await safe.connect(outsider).execTransaction(...args, signatures(owners.slice(0, 3)))).wait();
          assert.ok(!result.logs.some(log => { try { return safe.interface.parseLog(log)?.name === "ExecutionFailure"; } catch { return false; } }),
            "Safe internal execution failure");
          assert.equal(await token.balanceOf(recipient.address), amount);
          assert.equal(await token.balanceOf(await safe.getAddress()), supply - amount);
          assert.equal(await safe.nonce(), 1n);
          await rejected(safe.connect(outsider).execTransaction(...args, signatures(owners.slice(0, 3))),
            "Replay must fail");
          assert.equal(await token.totalSupply(), supply);
          console.log("Hardhat 3 Safe 3-of-5 passed: owners, threshold, unauthorized signatures, tampering, replay, supply");
          EOF
          node safe-smoke.mjs
      - name: Record Hardhat 3 dependency advisories
        if: always()
        working-directory: /tmp/nvra-hardhat3
        run: |
          npm audit --json > hardhat3-audit.json || true
          node -e 'const fs=require("fs");try{const x=JSON.parse(fs.readFileSync("hardhat3-audit.json"));console.log("Hardhat 3 audit",JSON.stringify(x.metadata?.vulnerabilities||{}))}catch(e){console.log(e.message)}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nvra-hardhat3-experiment-evidence
          path: /tmp/nvra-hardhat3/hardhat3-audit.json
          if-no-files-found: warn
          retention-days: 14
