name: NVRA Amoy read-only verification
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check script syntax
        run: node --check tests/verify-amoy.cjs
      - name: Verify contract on Polygon Amoy (read-only)
        run: node tests/verify-amoy.cjs
