name: NVRA Access Pass checks
on:
  push:
    paths:
      - 'assets/access-pass.js'
      - 'access-pass.html'
      - 'access-pass-en.html'
      - 'tests/access-pass.test.cjs'
      - '.github/workflows/access-pass.yml'
  pull_request:
    paths:
      - 'assets/access-pass.js'
      - 'access-pass.html'
      - 'access-pass-en.html'
      - 'tests/access-pass.test.cjs'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check assets/access-pass.js
      - name: Read-only RPC mock tests
        run: node tests/access-pass.test.cjs
